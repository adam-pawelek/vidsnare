name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # The smoke test runs the built app with the real bundled tools.
      - run: npm run fetch-binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: End-to-end smoke test
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: End-to-end smoke test
        if: runner.os == 'Windows'
        run: npm run test:e2e
